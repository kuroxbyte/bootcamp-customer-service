# Configuración de las pruebas: no se consulta config-server.
spring:
  config:
    # Toma la configuración común (circuit breaker y timeout) de config-repo.
    import: optional:file:../config-repo/application.yaml
  application:
    name: customer-service
  cloud:
    config:
      enabled: false
  mongodb:
    uri: mongodb://localhost:27017/customer_test_db
  kafka:
    bootstrap-servers: localhost:9092
    admin:
      # Las pruebas no crean tópicos ni esperan a un broker.
      auto-create: false

messaging:
  topics:
    customer-events: customer-events

eureka:
  client:
    # Las pruebas no se registran en Eureka.
    enabled: false

clients:
  account-service:
    base-url: http://account-service
  credit-service:
    base-url: http://credit-service
